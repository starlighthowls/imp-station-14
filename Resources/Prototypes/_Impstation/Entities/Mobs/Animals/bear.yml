- type: entity
  name: bear
  parent:
  - SimpleMobBase
  - MobCombat
  id: MobBear
  description: Just a bear?
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Impstation/Mobs/Animals/bear.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bear
  - type: Butcherable
    spawned:
    - id: FoodMeatBear
      amount: 3
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bear
      Critical:
        Base: bear_dead
      Dead:
        Base: bear_dead
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Vocal
    sounds:
      Unsexed: Bear
  - type: InteractionPopup
    successChance: 0.25
    interactSuccessString: petting-success-bear
    interactFailureString: petting-failure-bear
    interactSuccessSound:
      path: /Audio/Animals/sloth_squeak.ogg
